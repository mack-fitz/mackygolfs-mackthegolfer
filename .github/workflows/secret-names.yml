name: secret-names
# Writes the NAMES of this repo's Actions secrets (never values) to inbox/secret_names.txt.
on:
  push:
    paths: ['inbox/check-secrets.txt']
permissions:
  contents: write
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List secret names
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          echo "$ALL" | jq -r 'keys[]' | grep -v '^github_token$' > inbox/secret_names.txt || true
          rm -f inbox/check-secrets.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A inbox; git commit -m "Secret names" || exit 0; git push
